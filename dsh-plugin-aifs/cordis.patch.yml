# AIFS tool bundle. The official Web bundle supplies the surrounding
# conversation surface; this out-of-tree layer contributes the AIFS tools.
- insert:
    - id: aifs
      name: '@aifs/dsh-plugin-aifs'
      config:
        backendMode: !!js process.env.AIFS_BACKEND_MODE ?? 'managed'
        baseUrl: !!js process.env.AIFS_BACKEND_URL ?? 'http://127.0.0.1:8000'
        requestTimeoutMs: 30000
        maxResponseBytes: 1048576
